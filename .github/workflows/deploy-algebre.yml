name: Test and deploy Algèbre PWA

on:
  push:
    paths:
      - 'algebre-src/**'
      - '.github/workflows/deploy-algebre.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-algebre
  cancel-in-progress: true

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: algebre-src/package.json

      - name: Preserve app icons in source build
        shell: bash
        run: |
          mkdir -p algebre-src/public
          cp algebre/icon-192.png algebre-src/public/icon-192.png
          cp algebre/icon-512.png algebre-src/public/icon-512.png
          cp algebre/apple-touch-icon.png algebre-src/public/apple-touch-icon.png

      - name: Install dependencies
        working-directory: algebre-src
        run: npm install --no-audit --no-fund

      - name: Algebra and generator tests
        working-directory: algebre-src
        run: npm test

      - name: Install browser engines
        working-directory: algebre-src
        run: npx playwright install --with-deps chromium webkit

      - name: Browser ergonomics tests
        working-directory: algebre-src
        run: npm run test:e2e

      - name: Build production PWA
        working-directory: algebre-src
        run: npm run build

      - name: Publish tested build
        shell: bash
        run: |
          git pull --rebase origin main
          rm -rf algebre
          mkdir -p algebre
          cp -R algebre-src/dist/. algebre/

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add algebre
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
          else
            git commit -m 'Deploy tested Algèbre PWA [skip ci]'
            git push
          fi
