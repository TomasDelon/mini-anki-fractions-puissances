name: Deploy Algèbre PWA

on:
  push:
    paths:
      - 'deploy/algebre-src.b64.part*'
      - '.github/workflows/deploy-algebre.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-algebre
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check deployment payload
        id: payload
        shell: bash
        run: |
          if compgen -G 'deploy/algebre-src.b64.part*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'No deployment payload found; nothing to do.'
          fi

      - name: Reconstruct source archive
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          cat deploy/algebre-src.b64.part* | base64 --decode > /tmp/algebre-src.tar.xz
          mkdir -p /tmp/algebre-src
          tar -xJf /tmp/algebre-src.tar.xz -C /tmp/algebre-src

      - name: Install dependencies
        if: steps.payload.outputs.present == 'true'
        working-directory: /tmp/algebre-src
        run: npm install --no-audit --no-fund

      - name: Typecheck
        if: steps.payload.outputs.present == 'true'
        working-directory: /tmp/algebre-src
        run: npm run typecheck

      - name: Build for GitHub Pages subpath
        if: steps.payload.outputs.present == 'true'
        working-directory: /tmp/algebre-src
        run: npx vite build --base=/mini-anki-fractions-puissances/algebre/

      - name: Publish static build
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          rm -rf algebre
          mkdir -p algebre
          cp -R /tmp/algebre-src/dist/. algebre/
          rm -f deploy/algebre-src.b64.part*

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add algebre deploy
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
          else
            git commit -m 'Deploy Algèbre PWA [skip ci]'
            git push
          fi
