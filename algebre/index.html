    <style>
      /* The LaTeX labels inside keyboard buttons are presentation-only.
         On desktop MathLive's <math-field> captures pointer events before the
         parent button receives its click. Make the whole visible key surface
         belong to the button instead. */
      .keyboard .key-math-label,
      .keyboard .key math-field {
        pointer-events: none !important;
        user-select: none !important;
        -webkit-user-select: none !important;
      }

      .keyboard .key {
        cursor: pointer;
        touch-action: manipulation;
      }
