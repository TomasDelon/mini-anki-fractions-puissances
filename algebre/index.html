<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Algèbre" />
    <link rel="apple-touch-icon" href="/mini-anki-fractions-puissances/algebre/apple-touch-icon.png" />
    <title>Algèbre</title>
    <script type="module" crossorigin src="/mini-anki-fractions-puissances/algebre/assets/index-DvQoueyj.js"></script>
    <link rel="stylesheet" crossorigin href="/mini-anki-fractions-puissances/algebre/assets/index-BrMGeqoB.css">
    <link rel="manifest" href="/mini-anki-fractions-puissances/algebre/manifest.webmanifest">
    <script id="vite-plugin-pwa:register-sw" src="/mini-anki-fractions-puissances/algebre/registerSW.js"></script>
    <style id="algebre-ui-refinement">
      :root {
        --kb-purple: #5549bd;
        --kb-purple-soft: #f1efff;
        --kb-line: #dedfe5;
        --kb-surface: #f2f3f7;
      }

      .home-screen { max-width: 680px; }
      .home-header { margin-bottom: 22px; }
      .home-header h1 { letter-spacing: -.045em; }
      .category-list { gap: 9px; }
      .category-button {
        min-height: 70px;
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) auto 26px;
        gap: 10px;
        align-items: center;
        padding: 11px 12px 11px 15px !important;
        border-radius: 17px !important;
        text-align: left;
        box-shadow: 0 1px 1px rgba(20,22,28,.025);
      }
      .category-button > span:first-child {
        min-width: 0;
        font-weight: 700;
        letter-spacing: -.01em;
      }
      .category-button > span:last-child {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #f3f4f7;
        color: #8b8b94;
        font-size: 20px;
      }
      .category-injected-formula {
        width: auto !important;
        min-width: 0 !important;
        max-width: 145px;
        min-height: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        background: transparent !important;
        font-size: clamp(17px, 4.7vw, 21px) !important;
        color: #33323b !important;
        pointer-events: none;
        --caret-color: transparent;
      }
      .category-button--mixed { background: #f5f3ff !important; border-color: #e0dcff !important; }
      .category-button--mixed > span:last-child { background: #e9e5ff; color: var(--kb-purple); }

      .practice-category {
        display: flex !important;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .practice-injected-formula {
        width: auto !important;
        max-width: 112px;
        min-width: 0 !important;
        min-height: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        background: transparent !important;
        color: #4c4b55 !important;
        font-size: 15px !important;
        pointer-events: none;
        --caret-color: transparent;
      }

      .keyboard {
        background: rgba(242,243,247,.965) !important;
        border-top-color: rgba(215,216,223,.92) !important;
        box-shadow: 0 -8px 28px rgba(24,26,34,.045);
        backdrop-filter: blur(22px) saturate(1.15) !important;
        -webkit-backdrop-filter: blur(22px) saturate(1.15) !important;
      }
      .key-grid, .key-bottom-row { gap: 6px !important; }
      .key {
        min-height: 48px !important;
        border-radius: 12px !important;
        border-color: rgba(216,217,224,.96) !important;
        background: #fff !important;
        box-shadow: 0 1px 1px rgba(19,21,28,.05), 0 2px 7px rgba(19,21,28,.05);
        transition: transform 70ms ease, background 70ms ease, box-shadow 70ms ease;
      }
      .key:active { transform: translateY(1px) scale(.985) !important; box-shadow: 0 1px 1px rgba(19,21,28,.03); }
      .key[data-key="+"], .key[data-key="-"], .key[data-key="times"], .key[data-key="="], .key[data-key="pm"] {
        background: #f8f8fb !important;
      }
      .key[data-key="x"], .key[data-key="square"], .key[data-key="parentheses"],
      .key[data-key="fraction"], .key[data-key="sqrt"], .key[data-key="abs"] {
        background: #f9f8ff !important;
        border-color: #e6e2ff !important;
        color: #3d339a !important;
      }
      .key[data-key="x"] math-field { font-size: 25px !important; }
      .key[data-key="square"] math-field { font-size: 25px !important; }
      .key[data-key="fraction"] math-field { font-size: 17px !important; }
      .key[data-key="sqrt"] math-field { font-size: 18px !important; }
      .key[data-key="parentheses"] math-field, .key[data-key="abs"] math-field { font-size: 18px !important; }
      .key[data-key="up"], .key[data-key="down"], .key[data-key="left"], .key[data-key="right"], .key--backspace {
        background: #f4f5f8 !important;
        color: #585861 !important;
      }
      .key[data-key="or"] { background: #fafafa !important; }
      .key--selection { background: #fff !important; }
      .key--selection.key--active { background: var(--kb-purple-soft) !important; color: var(--kb-purple) !important; }
      .key--enter { background: #29292e !important; color: #fff !important; border-color: #29292e !important; }
      .keyboard-refined-hint {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin: 6px 2px 0;
        color: #898993;
        font-size: 10px;
        line-height: 1.15;
        user-select: none;
      }
      .keyboard-refined-hint > span { min-width: 0; }

      @media (max-width: 430px) {
        .category-injected-formula { max-width: 106px; font-size: 18px !important; }
        .practice-injected-formula { display: none; }
      }
      @media (max-width: 350px) {
        .keyboard-refined-hint { display: none; }
        .key-grid, .key-bottom-row { gap: 4px !important; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        if (window.__algebreErgonomicRefinement) return;
        window.__algebreErgonomicRefinement = true;

        let lastStudentMathField = null;

        const studentMathFieldFromEvent = (event) => {
          const path = typeof event.composedPath === 'function' ? event.composedPath() : [];
          for (const node of path) {
            if (node instanceof HTMLElement && node.tagName.toLowerCase() === 'math-field' && node.closest('.math-row')) return node;
          }
          const target = event.target;
          return target instanceof HTMLElement && target.tagName.toLowerCase() === 'math-field' && target.closest('.math-row') ? target : null;
        };

        const currentStudentField = () => {
          const active = document.activeElement;
          return active instanceof HTMLElement && active.tagName.toLowerCase() === 'math-field' && active.closest('.math-row')
            ? active
            : lastStudentMathField;
        };

        const setMathLabel = (button, latex) => {
          const mf = button?.querySelector('math-field');
          if (!mf) return;
          if (mf.value !== latex) mf.value = latex;
          mf.readOnly = true;
        };

        const BOX = '\\boxed{\\phantom{0}}';
        const keyLabels = {
          x: 'x',
          times: '\\times',
          square: '{}^{2}',
          parentheses: `\\left(${BOX}\\right)`,
          fraction: `\\dfrac{${BOX}}{${BOX}}`,
          sqrt: `\\sqrt{${BOX}}`,
          abs: `\\left|${BOX}\\right|`,
          or: '\\text{ ou }'
        };

        const desiredOrder = [
          '7','8','9','+','-',
          '4','5','6','times','=',
          '1','2','3','x','square',
          '0','pm','parentheses','fraction','sqrt',
          'abs','up','down','left','right'
        ];

        const decorateKeyboard = () => {
          const grid = document.querySelector('.key-grid');
          if (!grid) return;

          for (const key of desiredOrder) {
            const button = grid.querySelector(`[data-key="${CSS.escape(key)}"]`);
            if (button) grid.appendChild(button);
          }

          for (const [key, latex] of Object.entries(keyLabels)) {
            const button = document.querySelector(`[data-key="${key}"]`);
            if (button) setMathLabel(button, latex);
          }

          const keyboard = grid.closest('.keyboard');
          if (keyboard && !keyboard.querySelector('.keyboard-refined-hint')) {
            const hint = document.createElement('div');
            hint.className = 'keyboard-refined-hint';
            hint.innerHTML = '<span><b>x</b> puis <b>²</b> pour écrire x²</span><span>Sélection + structure pour entourer un bloc</span>';
            keyboard.appendChild(hint);
          }
        };

        const categoryFormulaByTitle = {
          'Équations simples': 'x+a=b',
          'Équations linéaires': 'ax+b=c',
          'Inconnue des deux côtés': 'ax+b=cx+d',
          'Parenthèses': 'a(x+b)+c=d',
          'Fractions': '\\dfrac{x+b}{a}=c',
          'Carrés et racines': 'x^2=r^2',
          'Équations ax² + c = 0': 'ax^2+c=0',
          'Équations quadratiques particulières': 'ax^2+c=0',
          'Mise en facteur': 'ax^2+bx=0',
          'Identités remarquables': '(a\\pm b)^2,\\;a^2-b^2',
          'Trinômes factorisables': '(x-r_1)(x-r_2)=0'
        };

        const normaliseCategoryTitle = (span) => {
          if (span.textContent.trim() === 'Équations ax² + c = 0') span.textContent = 'Équations quadratiques particulières';
        };

        const makeReadOnlyMath = (latex, className) => {
          const mf = document.createElement('math-field');
          mf.className = className;
          mf.setAttribute('read-only', '');
          mf.setAttribute('aria-hidden', 'true');
          mf.tabIndex = -1;
          requestAnimationFrame(() => {
            mf.value = latex;
            mf.readOnly = true;
          });
          return mf;
        };

        const decorateCategories = () => {
          document.querySelectorAll('.category-button').forEach((button) => {
            const title = button.querySelector(':scope > span:first-child');
            if (!title) return;
            const original = title.textContent.trim();
            const latex = categoryFormulaByTitle[original] || categoryFormulaByTitle[title.textContent.trim()];
            normaliseCategoryTitle(title);
            if (!latex || button.querySelector('.category-injected-formula')) return;
            const formula = makeReadOnlyMath(latex, 'category-injected-formula');
            button.insertBefore(formula, button.lastElementChild);
          });
        };

        const decoratePracticeHeader = () => {
          const header = document.querySelector('.practice-category');
          if (!header || header.querySelector('.practice-injected-formula')) return;
          const original = header.textContent.trim();
          const latex = categoryFormulaByTitle[original];
          if (original === 'Équations ax² + c = 0') header.textContent = 'Équations quadratiques particulières';
          if (!latex) return;
          header.appendChild(makeReadOnlyMath(latex, 'practice-injected-formula'));
        };

        const refine = () => {
          decorateKeyboard();
          decorateCategories();
          decoratePracticeHeader();
        };

        document.addEventListener('focusin', (event) => {
          const field = studentMathFieldFromEvent(event);
          if (field) lastStudentMathField = field;
        }, true);

        document.addEventListener('keydown', (event) => {
          if (event.key !== 'Backspace') return;
          const field = studentMathFieldFromEvent(event);
          if (!field || typeof field.value !== 'string' || field.value.trim() !== '') return;
          if (document.querySelectorAll('.student-rows .math-row').length <= 1) return;
          const backspace = document.querySelector('[data-key="backspace"]');
          if (!(backspace instanceof HTMLButtonElement)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          backspace.click();
        }, true);

        document.addEventListener('click', (event) => {
          const target = event.target instanceof Element ? event.target.closest('[data-key="or"]') : null;
          if (!target) return;
          const field = currentStudentField();
          if (!field || typeof field.insert !== 'function') return;
          event.preventDefault();
          event.stopImmediatePropagation();
          field.insert('\\text{ ou }#?', {
            insertionMode: 'replaceSelection',
            selectionMode: 'placeholder',
            focus: true
          });
          field.focus();
        }, true);

        document.addEventListener('click', (event) => {
          const target = event.target instanceof Element ? event.target.closest('[data-key="square"]') : null;
          if (!target) return;
          const selectionButton = document.querySelector('.key--selection');
          if (selectionButton?.getAttribute('aria-pressed') === 'true') return;
          const field = currentStudentField();
          if (!field || typeof field.insert !== 'function') return;
          event.preventDefault();
          event.stopImmediatePropagation();
          field.insert('^{2}', {
            insertionMode: 'replaceSelection',
            selectionMode: 'after',
            focus: true
          });
          field.focus();
        }, true);

        const observer = new MutationObserver(() => requestAnimationFrame(refine));
        observer.observe(document.getElementById('app'), { childList: true, subtree: true });
        window.addEventListener('load', () => setTimeout(refine, 80));
        setTimeout(refine, 150);
      })();
    </script>
  </body>
</html>
